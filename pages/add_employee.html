<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Employee</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/assets/input-onlinepngtools.png">
</head>
<body class="font-sans bg-gray-100">
  <header class="bg-white border-b border-gray-300 p-4">
    <a href="home.html" class="no-underline text-inherit hover:no-underline">
      <div class="flex items-center gap-4 ml-5">
        <img src="/assets/input-onlinepngtools.png" alt="Logo" class="w-12 h-12">
        <div class="leading-tight">
          <h1 class="text-yellow-500 text-2xl font-bold">EMPLOYEE</h1>
          <h1 class="text-2xl font-bold">PAYROLL</h1>
        </div>
      </div>
    </a>
  </header>

  <main class="p-6 bg-white mx-6 md:mx-32 my-6 rounded-lg shadow-lg">
    <form id="payroll-form" class="flex flex-col gap-6">
      <h2 class="text-xl font-semibold">Employee Payroll Form</h2>
      
      <div class="flex flex-col md:flex-row items-center gap-4">
        <label class="font-medium">Name:</label>
        <input id="inputName" class="form-control w-full md:w-[603px] p-2 border border-gray-300 rounded-md" required>
      </div>

      <div class="flex flex-col md:flex-row items-center gap-4">
        <label class="font-medium">Profile image:</label>
        <div class="flex flex-wrap gap-6 ml-0 md:ml-4">
          <label class="flex items-center cursor-pointer">
            <input type="radio" name="profileImageOptions" value="../Assets/profile1.png" class="form-check-input me-2">
            <img src="/assets/profile1.png" class="w-20 h-20 rounded-full">
          </label>
          <label class="flex items-center cursor-pointer">
            <input type="radio" name="profileImageOptions" value="../Assets/profile2.png" class="form-check-input me-2">
            <img src="/assets/profile2.png" class="w-20 h-20 rounded-full">
          </label>
          <label class="flex items-center cursor-pointer">
            <input type="radio" name="profileImageOptions" value="../Assets/profile3.png" class="form-check-input me-2">
            <img src="/assets/profile3.png" class="w-20 h-20 rounded-full">
          </label>
          <label class="flex items-center cursor-pointer">
            <input type="radio" name="profileImageOptions" value="../Assets/profile4.png" class="form-check-input me-2">
            <img src="/assets/profile4.png" class="w-20 h-20 rounded-full">
          </label>
        </div>
      </div>

      <div class="flex flex-col md:flex-row items-center gap-4">
        <label class="font-medium">Gender:</label>
        <div class="flex gap-6 ml-0 md:ml-14">
          <label class="flex items-center cursor-pointer">
            <input type="radio" name="genderRadioOptions" value="Male" class="form-check-input me-2"> Male
          </label>
          <label class="flex items-center cursor-pointer">
            <input type="radio" name="genderRadioOptions" value="Female" class="form-check-input me-2"> Female
          </label>
        </div>
      </div>

      <div class="flex flex-col md:flex-row items-center gap-4">
        <label class="font-medium">Department:</label>
        <div class="flex flex-wrap gap-6 ml-0 md:ml-6">
          <label class="flex items-center cursor-pointer">
            <input type="checkbox" name="departmentOptions" value="HR" class="form-check-input me-2"> HR
          </label>
          <label class="flex items-center cursor-pointer">
            <input type="checkbox" name="departmentOptions" value="Sales" class="form-check-input me-2"> Sales
          </label>
          <label class="flex items-center cursor-pointer">
            <input type="checkbox" name="departmentOptions" value="Finance" class="form-check-input me-2"> Finance
          </label>
          <label class="flex items-center cursor-pointer">
            <input type="checkbox" name="departmentOptions" value="Consultancy" class="form-check-input me-2"> Consultancy
          </label>
          <label class="flex items-center cursor-pointer">
            <input type="checkbox" name="departmentOptions" value="Other" class="form-check-input me-2"> Other
          </label>
        </div>
      </div>

      <div class="flex flex-col md:flex-row items-center gap-4">
        <label class="font-medium">Salary:</label>
        <select id="salaryRange" class="form-select w-full md:w-72 p-2 border border-gray-300 rounded-md ml-0 md:ml-24" required>
          <option value="">Select Salary</option>
          <option value="₹ 10,000">₹ 10,000</option>
          <option value="₹ 20,000">₹ 20,000</option>
          <option value="₹ 30,000">₹ 30,000</option>
          <option value="₹ 40,000">₹ 40,000</option>
          <option value="₹ 50,000">₹ 50,000</option>
        </select>
      </div>

      <div class="flex flex-col md:flex-row items-center gap-4">
        <label class="font-medium">Start Date:</label>
        <select id="year" class="form-select w-full md:w-44 p-2 border border-gray-300 rounded-md ml-0 md:ml-10">
          <option value="">Year</option>
        </select>
        <select id="month" class="form-select w-full md:w-44 p-2 border border-gray-300 rounded-md">
          <option value="">Month</option>
        </select>
        <select id="date" class="form-select w-full md:w-44 p-2 border border-gray-300 rounded-md">
          <option value="">Date</option>
        </select>
      </div>
      
      <div class="flex flex-col md:flex-row items-center gap-4">
        <label class="font-medium">Notes:</label>
        <textarea id="Textarea1" class="form-control w-full md:w-[603px] h-20 p-2 border border-gray-300 rounded-md ml-0 md:ml-24"></textarea>
      </div>

      <div class="flex flex-wrap gap-3 mt-6">
        <button type="button" id="cancelBtn" class="btn bg-gray-500 text-white h-12 w-32 rounded-md hover:bg-red-600 hover:opacity-60">Cancel</button>
        <button type="reset" id="resetBtn" class="btn bg-gray-500 text-white h-12 w-32 rounded-md hover:bg-blue-600 hover:opacity-60 ms-auto">Reset</button>
        <button type="submit" id="submitBtn" class="btn bg-gray-500 text-white h-12 w-32 rounded-md hover:bg-green-600 hover:opacity-60">Submit</button>
      </div>
    </form>
  </main>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="/script/add_employee.js"></script>
</body>
</html>
