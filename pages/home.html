<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Payroll</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/assets/input-onlinepngtools.png">
</head>
<body class="font-sans bg-gray-100">
  <header class="bg-white border-b border-gray-300 p-4">
    <a href="home.html" class="no-underline text-inherit hover:no-underline">
      <div class="flex items-center gap-4 ml-5">
        <img src="/assets/input-onlinepngtools.png" alt="Logo" class="w-12 h-12">
        <div class="leading-tight">
          <h1 class="text-yellow-500 text-2xl font-bold">EMPLOYEE</h1>
          <h1 class="text-2xl font-bold">PAYROLL</h1>
        </div>
      </div>
    </a>
  </header>

  <main class="p-6 bg-white m-6 rounded-lg shadow-lg">
    <div class="flex justify-between items-center flex-wrap">
      <h2 class="text-xl font-semibold">Employee Details</h2>
      <div class="flex items-center gap-3">
        <input class="form-control w-9 h-9 p-2 rounded-full border border-gray-300 bg-[url('/assets/search.png')] bg-no-repeat bg-center bg-[length:18px] transition-all focus:w-44 focus:pl-8" style="background-position: 10px center;">
        <button onclick="window.location.href='../Pages/add_employee.html'" class="btn bg-lime-500 text-white font-bold text-base rounded-md h-12 w-32 hover:bg-gray-200 hover:text-lime-500 transition-all">Add User</button>
      </div>
    </div>

    <table class="table table-bordered w-full mt-4">
      <thead>
        <tr class="bg-gray-700 text-white">
          <th scope="col">NAME</th>
          <th scope="col">GENDER</th>
          <th scope="col">DEPARTMENT</th>
          <th scope="col">SALARY</th>
          <th scope="col">START DATE</th>
          <th scope="col">ACTIONS</th>
        </tr>
      </thead>
      <tbody id="employee-table-body">
        <!-- JS populated -->
      </tbody>
    </table>
  </main>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="/script/home.js"></script>
</body>
</html>
